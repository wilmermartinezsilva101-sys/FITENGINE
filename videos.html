            </div>

            </div>
        </div>

        <div class="channel-section">
            <h3 class="text-2xl font-black uppercase italic text-white mb-6">Will <span class="text-yellow-500">Tennyson</span></h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="video-card"><div class="aspect-video"><iframe class="w-full h-full" src="https://www.youtube.com/embed/J8FG3f-hQ_c" frameborder="0" allowfullscreen></iframe></div></div>
                <div class="video-card"><div class="aspect-video"><iframe class="w-full h-full" src="https://www.youtube.com/embed/udafG9KUhdA" frameborder="0" allowfullscreen></iframe></div></div>

<div id="modalPerfil" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-[#0d1117] border border-[#30363d] p-10 rounded-[3rem] w-full max-w-md shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-yellow-500 uppercase italic">Perfil <span class="text-white">Elite</span></h2>
            <button onclick="document.getElementById('modalPerfil').classList.add('hidden')" class="text-slate-500 hover:text-white font-black text-2xl transition-all">✕</button>
        </div>
        <div class="space-y-5">
            <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic tracking-widest">Peso Actual (KG)</label><input type="text" id="editPeso" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black italic"></div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic">Altura (CM)</label><input type="text" id="editAltura" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black text-center italic"></div>
                <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic">Edad</label><input type="text" id="editEdad" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black text-center italic"></div>
            </div>
            <button id="btnGuardarCambios" class="w-full bg-yellow-500 text-black font-black py-5 rounded-[1.5rem] hover:bg-yellow-400 transition-all shadow-xl mt-6 uppercase italic tracking-tighter">Sincronizar 🔥</button>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // Listener instantáneo para el perfil
    document.getElementById("btnPerfil").onclick = () => {
        document.getElementById("modalPerfil").classList.remove("hidden");
    };

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        try {
            const userSnap = await getDoc(doc(db, "usuarios", user.uid));
            if (userSnap.exists()) {
                const userData = userSnap.data();
                const inicial = (userData.nombre && userData.nombre[0] ? userData.nombre[0] : "W").toUpperCase();
                document.getElementById("userInitialNav").innerText = inicial;
                
                // Cargar datos en el modal
                document.getElementById("editPeso").value = userData.peso_corporal_kg;
                document.getElementById("editAltura").value = userData.altura_cm;
                document.getElementById("editEdad").value = userData.edad;
            }
        } catch (e) { console.error("Error Perfil:", e); }
    });

    document.getElementById("btnGuardarCambios").onclick = async () => {
        try {
            await updateDoc(doc(db, "usuarios", auth.currentUser.uid), {
                peso_corporal_kg: parseFloat(document.getElementById("editPeso").value),
                altura_cm: parseInt(document.getElementById("editAltura").value),
                edad: parseInt(document.getElementById("editEdad").value)
            });
            location.reload();
        } catch(e) { alert("Error al sincronizar."); }
    };
</script>
</body>
</html>
