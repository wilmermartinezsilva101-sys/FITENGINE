<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitEngine Pro - Galería Automatizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade { animation: fade .5s ease-in-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .video-card { transition: all 0.4s ease; background: #0d1117; border: 1px solid #30363d; }
        .video-card:hover { transform: translateY(-8px); border-color: #eab308; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .nav-active { color: #eab308; border-top: 2px solid #eab308; padding-top: 4px; }
    </style>
</head>
<body class="bg-[#010409] text-slate-200 font-sans min-h-screen pb-32 overflow-x-hidden selection:bg-yellow-500 selection:text-black">

<nav class="p-5 bg-[#0d1117]/80 backdrop-blur-md border-b border-[#30363d] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-500 italic uppercase tracking-tighter">FIT<span class="text-white">ENGINE</span></h1>
        <div id="userBadge" class="w-9 h-9 bg-yellow-500 rounded-full flex items-center justify-center text-black font-black text-xs shadow-lg">W</div>
    </div>
</nav>

<div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0d1117]/95 backdrop-blur-lg border-t border-[#30363d] flex justify-around items-center p-3 z-[100] pb-8">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-500"><span class="text-[20px]">📊</span><span class="text-[8px] font-black uppercase italic">Dashboard</span></a>
    <a href="videos.html" class="flex flex-col items-center gap-1 nav-active"><span class="text-[20px]">🎬</span><span class="text-[8px] font-black uppercase italic">Videos</span></a>
    <a href="nutricion.html" class="flex flex-col items-center gap-1 text-slate-500"><span class="text-[20px]">🥗</span><span class="text-[8px] font-black uppercase italic">Nutrición</span></a>
</div>

<main class="max-w-7xl mx-auto p-4 md:p-8 space-y-12">
    <header class="text-center space-y-3">
        <h2 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter italic">Zona de <span class="text-yellow-500">Motivación</span></h2>
        <p id="api-status" class="text-yellow-500/50 text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse">Sincronizando últimas cargas de la Élite...</p>
    </header>

    <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
        </div>
</main>

<script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // LLAVE VERIFICADA DESDE image_cdc801.png
    const API_KEY = 'AIzaSyBr9WCJYB0D12xfpDhrB5rtUtULSQ6plkM'; 
    
    const CHANNELS = [
        { id: 'UCj0v9MvUv_t0H8N5F1g', name: 'Carlos Belcast' },
        { id: 'UC_0r8bM9S9fHjZ_nL2g', name: 'Andoni Fitness' },
        { id: 'UC_MInM2v9Xf_G9m7H2g', name: 'LeanBeefPatty' },
        { id: 'UCRvVIsba7jz77mN6_h7wOnA', name: 'Will Tennyson' },
        { id: 'UCY5M_oT7S9W38K-N9nK2l_g', name: 'Aristizabal' },
        { id: 'UCXm-yN8W6S77Z4XpP198A2w', name: 'Segun Fitness' },
        { id: 'UC9_l1z8_f2D9P_pYfO18rWw', name: 'Joan Pradells' },
        { id: 'UCh_6W3r_zM8K4-P5O9I8yWw', name: 'Mazi Fitness' },
        { id: 'UC_k1P_zO8M5W4-P9O1I7yWg', name: 'Pico de Oro' }
    ];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            if (snap.exists()) document.getElementById("userBadge").innerText = (snap.data().nombre[0] || "W").toUpperCase();
            
            fetchUltimosVideos();
        } else { window.location.href = "login.html"; }
    });

    async function fetchUltimosVideos() {
        const grid = document.getElementById('video-grid');
        const status = document.getElementById('api-status');
        grid.innerHTML = '';

        for (const channel of CHANNELS) {
            try {
                // LOGICA DE INGENIERÍA: Búsqueda directa por canal ordenada por fecha
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channel.id}&maxResults=1&order=date&type=video&key=${API_KEY}`;
                
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) {
                    console.error("Fallo en:", channel.name, data.error.message);
                    continue; 
                }

                if (data.items && data.items.length > 0) {
                    const v = data.items[0];
                    renderCard(v.id.videoId, v.snippet.title, channel.name);
                }
            } catch (e) { console.error("Error de red"); }
        }
        status.innerText = "Sincronización de Élite Completada ✅";
        status.classList.remove('animate-pulse');
    }

    function renderCard(id, title, name) {
        const grid = document.getElementById('video-grid');
        const card = document.createElement('div');
        card.className = "video-card rounded-[2.5rem] overflow-hidden shadow-2xl fade mb-4";
        card.innerHTML = `
            <div class="aspect-video relative">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="p-6 md:p-8 space-y-2">
                <span class="text-[9px] bg-slate-800 text-yellow-500 px-3 py-1 rounded-full font-black uppercase italic border border-yellow-500/20">${name}</span>
                <h3 class="font-black text-sm text-white uppercase italic tracking-tighter leading-tight line-clamp-2">${title}</h3>
            </div>`;
        grid.appendChild(card);
    }
</script>
</body>
</html>
