    <style>
        /* ============================================================
           ANIMACIONES Y ESTILOS CINEMATOGRÁFICOS
           ============================================================ */
        .fade { animation: fade .5s ease-in-out; }
        @keyframes fade { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        details summary { cursor: pointer; transition: all 0.3s; list-style: none; }
        details summary::-webkit-details-marker { display: none; }
        details[open] summary { color: #eab308; transform: translateX(5px); }

        .tutorial-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            backdrop-filter: blur(15px); z-index: 9999;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 40px;
        }
        .video-card { background: #0d1117; border: 1px solid #30363d; border-radius: 2rem; overflow: hidden; transition: 0.3s; height: 100%; }
        .video-card:hover { border-color: #eab308; transform: translateY(-8px); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .channel-section { border-left: 4px solid #eab308; padding-left: 1.5rem; margin-bottom: 3rem; }
        .nav-active { color: #eab308; border-top: 2px solid #eab308; padding-top: 4px; }
        
        /* Filtros con estética FitEngine */
        .filter-btn { background: #0d1117; border: 1px solid #30363d; transition: 0.3s; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { border-color: #eab308; color: #eab308; transform: scale(1.05); box-shadow: 0 0 20px rgba(234, 179, 8, 0.2); }

        .tutorial-box {
            background: #020617; border: 2px solid #eab308; padding: 28px;
            border-radius: 24px; max-width: 90%; width: 420px; 
            animation: fade .3s ease; box-shadow: 0 0 60px rgba(234,179,8,0.4);
        }

        .highlight {
            position: relative; z-index: 10000;
            box-shadow: 0 0 0 12px rgba(234,179,8,0.9); border-radius: 12px;
            background: #0f172a !important;
        }

        .history-card { 
            background: #0f172a; border-left: 5px solid #eab308; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; position: relative;
        }
        .history-card:hover { 
            background: #1e293b; transform: scale(1.02); 
            border-left-width: 15px;
        }

        #listaHistorial::-webkit-scrollbar { width: 5px; }
        #listaHistorial::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Estilo para el Bottom Nav activo */
        .nav-active { color: #eab308; border-top: 2px solid #eab308; padding-top: 4px; }
    </style>
</head>

<main class="max-w-7xl mx-auto p-4 md:p-8 space-y-12">
    <header class="text-center">
        <h2 class="text-5xl md:text-8xl font-black uppercase italic tracking-tighter">Zona de <span class="text-yellow-500">Poder</span></h2>
        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.5em] mt-4 italic">Conexión Directa con la Élite Mundial ✅</p>
    </header>

    <div class="flex overflow-x-auto md:overflow-visible pb-4 md:pb-0 justify-start md:justify-center gap-3 md:gap-4 no-scrollbar">
        <button onclick="filterContent('Todos')" class="filter-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Todos">Todos</button>
        <button onclick="filterContent('Influencers')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Influencers">Influencers 🔥</button>
        <button onclick="filterContent('Pierna')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Pierna">Piernas</button>
        <button onclick="filterContent('Pecho')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Pecho">Pecho</button>
        <button onclick="filterContent('Espalda')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Espalda">Espalda</button>
        <button onclick="filterContent('Gluteos')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest" id="btn-Gluteos">Glúteos 🍑</button>
        <button onclick="filterContent('Nutricion')" class="filter-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase italic tracking-widest text-yellow-500" id="btn-Nutricion">Nutrición 🥗</button>
    </div>

    <div id="dynamic-video-container" class="fade space-y-16">
        </div>
</main>

<div id="modalPerfil" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-[#0d1117] border border-[#30363d] p-10 rounded-[3rem] w-full max-w-md shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-yellow-500 uppercase italic">Perfil <span class="text-white">Elite</span></h2>
            <button onclick="document.getElementById('modalPerfil').classList.add('hidden')" class="text-slate-500 hover:text-white font-black text-2xl transition-all">✕</button>
        </div>
        <div class="space-y-5">
            <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic tracking-widest">Peso Actual (KG)</label><input type="text" id="editPeso" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black italic"></div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic">Altura (CM)</label><input type="text" id="editAltura" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black text-center italic"></div>
                <div><label class="text-[10px] font-black text-slate-500 uppercase ml-2 italic">Edad</label><input type="text" id="editEdad" class="w-full h-14 p-4 rounded-2xl bg-[#010409] border border-[#30363d] text-white font-black text-center italic"></div>
            </div>
            <button id="btnGuardarCambios" class="w-full bg-yellow-500 text-black font-black py-5 rounded-[1.5rem] hover:bg-yellow-400 transition-all shadow-xl mt-6 uppercase italic tracking-tighter">Sincronizar 🔥</button>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- BASE DE DATOS LIMPIA (IDs corregidos) ---
    const contentData = {
        Influencers: {
            title: "Elite <span class='text-yellow-500'>Influencers</span>",
            videos: ["6WFDG5o9vP4", "9sBscyNwHeY", "TR-3HmWchVA", "jf5sdZcp5JU", "VgZNc0yTwx0"]
        },
        Pierna: {
            title: "Día de <span class='text-yellow-500'>Pierna</span>",
            videos: ["tfyPIZF3gsk","ah7NvEVA6NY", "tMllGLfOid4", "EDMYeNRlRpA"]
        },
        Pecho: {
            title: "Poder en <span class='text-yellow-500'>Pecho</span>",
            videos: ["wXeD59yPHrE", "x7Z4uGQyEWc", "HwnHJoCIXXo", "MwXuDZOJnBc"]
        },
        Espalda: {
            title: "Espalda de <span class='text-yellow-500'>Hierro</span>",
            videos: ["xJGkrfBy-dQ", "J8FG3f-hQ_c", "IXZu4nwh6b4"]
        },
        Gluteos: {
            title: "Glúteos & <span class='text-yellow-500'>Femoral</span>",
            videos: ["eIL5aI3ktm8", "rwutUfRRGEA", "RQ1w1BEsVkQ"]
        },
        Nutricion: {
            title: "Nutrición <span class='text-yellow-500'>& Grasa</span>",
            videos: ["RSqIvvrDPOg", "Id3CQsF0618", "9t85ZjCya10"]
        }
    };

    // Función Global de Filtro
    window.filterContent = (category) => {
        const container = document.getElementById('dynamic-video-container');
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${category}`).classList.add('active');

        container.style.opacity = '0';
        setTimeout(() => {
            if (category === 'Todos') renderAll();
            else renderCategory(category);
            container.style.opacity = '1';
        }, 200);
    };

    function renderCategory(cat) {
        const data = contentData[cat];
        const container = document.getElementById('dynamic-video-container');
        container.innerHTML = `
            <div class="channel-section fade">
                <h3 class="text-2xl font-black uppercase italic text-white mb-6">${data.title}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${data.videos.map(id => `
                        <div class="video-card"><div class="aspect-video">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>
                        </div></div>
                    `).join('')}
                </div>
            </div>`;
    }

    function renderAll() {
        const container = document.getElementById('dynamic-video-container');
        container.innerHTML = Object.keys(contentData).map(cat => `
            <div class="channel-section fade">
                <h3 class="text-2xl font-black uppercase italic text-white mb-6">${contentData[cat].title}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${contentData[cat].videos.slice(0, 3).map(id => `
                        <div class="video-card"><div class="aspect-video">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>
                        </div></div>
                    `).join('')}
                </div>
            </div>`).join('');
    }

    // Lógica de Usuario y Perfil
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        try {
            const userSnap = await getDoc(doc(db, "usuarios", user.uid));
            if (userSnap.exists()) {
                const userData = userSnap.data();
                document.getElementById("userInitialNav").innerText = (userData.nombre ? userData.nombre[0] : "W").toUpperCase();
                document.getElementById("editPeso").value = userData.peso_corporal_kg || "";
                document.getElementById("editAltura").value = userData.altura_cm || "";
                document.getElementById("editEdad").value = userData.edad || "";
            }
        } catch (e) { console.error(e); }
    });

    document.getElementById("btnPerfil").onclick = () => document.getElementById("modalPerfil").classList.remove("hidden");
    
    document.getElementById("btnLogout").onclick = async () => {
        await signOut(auth);
        window.location.href = "login.html";
    };

    document.getElementById("btnGuardarCambios").onclick = async () => {
        try {
            await updateDoc(doc(db, "usuarios", auth.currentUser.uid), {
                peso_corporal_kg: parseFloat(document.getElementById("editPeso").value),
                altura_cm: parseInt(document.getElementById("editAltura").value),
                edad: parseInt(document.getElementById("editEdad").value)
            });
            location.reload();
        } catch(e) { alert("Error al sincronizar."); }
    };

    renderAll();
</script>
</body>
</html>
