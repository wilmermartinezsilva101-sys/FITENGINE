<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitEngine Pro - Galería Motivacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade { animation: fade .5s ease-in-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .video-card { background: #0d1117; border: 1px solid #30363d; border-radius: 1.5rem; transition: transform 0.3s ease; overflow: hidden; }
        .video-card:hover { transform: translateY(-5px); border-color: #eab308; }
        .nav-active { color: #eab308; border-top: 2px solid #eab308; padding-top: 4px; }
    </style>
</head>
<body class="bg-[#010409] text-slate-200 font-sans min-h-screen pb-32">

<nav class="p-5 bg-[#0d1117]/90 backdrop-blur-lg border-b border-[#30363d] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-500 italic italic uppercase">FIT<span class="text-white">ENGINE</span></h1>
        <div id="userBadge" class="w-9 h-9 bg-yellow-500 rounded-full flex items-center justify-center text-black font-black text-xs">W</div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-4 md:p-8 space-y-12">
    <header class="text-center space-y-3">
        <h2 class="text-4xl md:text-6xl font-black text-white uppercase italic tracking-tighter">Zona de <span class="text-yellow-500">Motivación</span></h2>
        <p id="status-msg" class="text-yellow-500/50 text-[10px] font-bold uppercase tracking-widest animate-pulse">Iniciando Bypass de Ingeniería...</p>
    </header>

    <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
        </div>
</main>

<div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0d1117]/95 backdrop-blur-lg border-t border-[#30363d] flex justify-around p-4 z-[100] pb-8">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-500 text-[10px] uppercase font-bold italic"><span>📊</span>Dash</a>
    <a href="videos.html" class="flex flex-col items-center gap-1 nav-active text-[10px] uppercase font-bold italic text-yellow-500"><span>🎬</span>Videos</a>
    <a href="nutricion.html" class="flex flex-col items-center gap-1 text-slate-500 text-[10px] uppercase font-bold italic"><span>🥗</span>Nutri</a>
</div>

<script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // --- CONFIGURACIÓN DE CANALES (IDs OFICIALES) ---
    const CHANNELS = [
        { id: 'UCj0v9MvUv_t0H8N5F1g', name: 'Carlos Belcast' },
        { id: 'UC_0r8bM9S9fHjZ_nL2g', name: 'Andoni Fitness' },
        { id: 'UC_MInM2v9Xf_G9m7H2g', name: 'LeanBeefPatty' },
        { id: 'UCRvVIsba7jz77mN6_h7wOnA', name: 'Will Tennyson' },
        { id: 'UCY5M_oT7S9W38K-N9nK2l_g', name: 'Aristizabal' },
        { id: 'UCXm-yN8W6S77Z4XpP198A2w', name: 'Segun Fitness' }
    ];

    onAuthStateChanged(auth, (user) => {
        if (user) {
            cargarVideosRSS();
        } else {
            window.location.href = "login.html";
        }
    });

    async function cargarVideosRSS() {
        const grid = document.getElementById('video-grid');
        const status = document.getElementById('status-msg');
        grid.innerHTML = ''; // Limpiar pantalla

        for (const canal of CHANNELS) {
            try {
                // BYPASS: Usamos el feed público de YouTube convertido a JSON
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${canal.id}`;
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await res.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    const video = data.items[0];
                    const videoId = video.link.split('v=')[1];
                    
                    const card = document.createElement('div');
                    card.className = "video-card fade shadow-2xl";
                    card.innerHTML = `
                        <div class="aspect-video relative">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-5 space-y-2">
                            <span class="text-[8px] bg-slate-800 text-yellow-500 px-3 py-1 rounded-full font-black uppercase tracking-tighter">${canal.name}</span>
                            <h3 class="font-black text-xs text-white uppercase italic leading-tight line-clamp-2">${video.title}</h3>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (error) {
                console.error("Error cargando canal:", canal.name);
            }
        }
        status.innerText = "Sincronización de Élite Completada ✅";
        status.classList.remove('animate-pulse');
    }
</script>
</body>
</html>
