<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitEngine Pro - Motivation Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .video-card { background: #0d1117; border: 1px solid #30363d; border-radius: 2rem; overflow: hidden; transition: 0.3s; }
        .video-card:hover { border-color: #eab308; transform: translateY(-5px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-[#010409] text-white font-sans min-h-screen pb-32 selection:bg-yellow-500 selection:text-black">

<nav class="p-5 border-b border-[#30363d] bg-[#0d1117]/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-500 italic uppercase">FIT<span class="text-white">ENGINE</span></h1>
        <div id="userBadge" class="w-9 h-9 bg-yellow-500 rounded-full flex items-center justify-center text-black font-black text-xs shadow-lg">W</div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6 space-y-12">
    <header class="text-center">
        <h2 class="text-4xl md:text-7xl font-black uppercase italic tracking-tighter">Zona de <span class="text-yellow-500">Motivación</span></h2>
        <p id="status" class="text-yellow-500/50 text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse mt-4">Sincronización Directa de Ingeniería Activada ✅</p>
    </header>

    <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
</main>

<div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0d1117]/95 backdrop-blur-lg border-t border-[#30363d] flex justify-around p-4 z-[100] pb-10">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-500 text-[9px] font-black uppercase italic"><span>📊</span>Dash</a>
    <a href="videos.html" class="flex flex-col items-center gap-1 text-yellow-500 text-[9px] font-black uppercase italic border-t-2 border-yellow-500 pt-1"><span>🎬</span>Videos</a>
    <a href="nutricion.html" class="flex flex-col items-center gap-1 text-slate-500 text-[9px] font-black uppercase italic"><span>🥗</span>Nutri</a>
</div>

<script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const CHANNELS = [
        { id: 'UCj0v9MvUv_t0H8N5F1g', name: 'Carlos Belcast' },
        { id: 'UC_0r8bM9S9fHjZ_nL2g', name: 'Andoni Fitness' },
        { id: 'UC_MInM2v9Xf_G9m7H2g', name: 'LeanBeefPatty' },
        { id: 'UCRvVIsba7jz77mN6_h7wOnA', name: 'Will Tennyson' },
        { id: 'UCY5M_oT7S9W38K-N9nK2l_g', name: 'Aristizabal' },
        { id: 'UCXm-yN8W6S77Z4XpP198A2w', name: 'Segun Fitness' }
    ];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await getDoc(doc(db, "usuarios", user.uid));
            if (snap.exists()) document.getElementById("userBadge").innerText = (snap.data().nombre[0] || "W").toUpperCase();
            cargarVideosSinAPI();
        } else { window.location.href = "login.html"; }
    });

    async function cargarVideosSinAPI() {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = '';

        for (const canal of CHANNELS) {
            try {
                // BYPASS FINAL: Usamos un proxy de código abierto para leer el XML sin API KEY
                const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${canal.id}`;
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
                const json = await res.json();
                
                // Parseamos el XML manualmente para sacar el ID del video
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(json.contents, "text/xml");
                const entry = xmlDoc.getElementsByTagName("entry")[0];
                const videoId = entry.getElementsByTagName("yt:videoId")[0].textContent;
                const title = entry.getElementsByTagName("title")[0].textContent;

                const card = document.createElement('div');
                card.className = "video-card fade-in shadow-2xl";
                card.innerHTML = `
                    <div class="aspect-video relative bg-black">
                        <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="p-6">
                        <span class="text-[9px] bg-yellow-500 text-black px-2 py-0.5 rounded font-black uppercase italic">${canal.name}</span>
                        <h3 class="text-sm font-bold mt-2 uppercase italic leading-tight line-clamp-2">${title}</h3>
                    </div>
                `;
                grid.appendChild(card);
            } catch (e) { console.error("Fallo en bypass para: " + canal.name); }
        }
    }
</script>
</body>
</html>
