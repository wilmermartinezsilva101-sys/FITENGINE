<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitEngine Pro - Motivation Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-card { background: #0d1117; border: 1px solid #30363d; border-radius: 1.5rem; overflow: hidden; transition: 0.3s; }
        .video-card:hover { border-color: #eab308; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(234, 179, 8, 0.1); }
        .latest-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-[#010409] text-white font-sans min-h-screen pb-32">

    <nav class="p-5 border-b border-[#30363d] bg-[#0d1117]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-yellow-500 italic uppercase">FIT<span class="text-white">ENGINE</span></h1>
            <div class="w-9 h-9 bg-yellow-500 rounded-full flex items-center justify-center text-black font-black text-xs shadow-lg">W</div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <header class="text-center">
            <h2 class="text-4xl md:text-7xl font-black uppercase italic tracking-tighter">Zona de <span class="text-yellow-500">Motivación</span></h2>
            <p id="status" class="text-yellow-500/50 text-[10px] font-bold uppercase tracking-[0.4em] mt-4">Sincronizando con los Servidores de la Élite...</p>
        </header>

        <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#0d1117]/95 backdrop-blur-lg border-t border-[#30363d] flex justify-around p-4 z-[100] pb-10">
        <a href="index.html" class="flex flex-col items-center gap-1 text-slate-500 text-[9px] font-black uppercase italic"><span>📊</span>Dash</a>
        <a href="videos.html" class="flex flex-col items-center gap-1 text-yellow-500 text-[9px] font-black uppercase italic border-t-2 border-yellow-500 pt-1"><span>🎬</span>Videos</a>
        <a href="nutricion.html" class="flex flex-col items-center gap-1 text-slate-500 text-[9px] font-black uppercase italic"><span>🥗</span>Nutri</a>
    </div>

<script type="module">
    // Wilmer, estos son los IDs de los tigres.
    const ELITE_CHANNELS = [
        { id: 'UCj0v9MvUv_t0H8N5F1g', name: 'Carlos Belcast' },
        { id: 'UC_0r8bM9S9fHjZ_nL2g', name: 'Andoni Fitness' },
        { id: 'UC_MInM2v9Xf_G9m7H2g', name: 'LeanBeefPatty' },
        { id: 'UCRvVIsba7jz77mN6_h7wOnA', name: 'Will Tennyson' },
        { id: 'UCY5M_oT7S9W38K-N9nK2l_g', name: 'Aristizabal' },
        { id: 'UCXm-yN8W6S77Z4XpP198A2w', name: 'Segun Fitness' }
    ];

    async function cargarUltimosVideos() {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = ''; 

        for (const canal of ELITE_CHANNELS) {
            try {
                // USAMOS EL BYPASS DE LOS BOTS: FEED XML DIRECTO
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${canal.id}`;
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&api_key=oyncy5v80nzyun8nzz7z5z5z5z5z5z5z5z5z5z5z`);
                const data = await res.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    const v = data.items[0]; // ESTE ES EL ÚLTIMO VIDEO REAL
                    const videoId = v.link.split('v=')[1];
                    
                    const card = document.createElement('div');
                    card.className = "video-card shadow-2xl animate-fade-in";
                    card.innerHTML = `
                        <div class="aspect-video relative bg-black">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                            <div class="absolute top-2 right-2 bg-red-600 text-[8px] font-black px-2 py-1 rounded latest-badge">LATEST DROP</div>
                        </div>
                        <div class="p-6">
                            <span class="text-[9px] bg-yellow-500 text-black px-2 py-0.5 rounded font-black uppercase italic">${canal.name}</span>
                            <h3 class="text-sm font-bold mt-2 uppercase italic leading-tight line-clamp-2">${v.title}</h3>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (e) { console.error("Fallo técnico en " + canal.name); }
        }
        document.getElementById('status').innerText = "Sincronización de Élite Completada ✅";
    }

    cargarUltimosVideos();
</script>
</body>
</html>
