<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitEngine Pro - Biblioteca Élite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        .fade { animation: fade .4s ease-in-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .ex-card { background: #0d1117; border: 1px solid #30363d; transition: 0.3s; cursor: pointer; display: flex; flex-col; height: 100%;}
        .ex-card:hover { border-color: #3b82f6; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1); }
        
        /* Botones de filtro estilo FitAI */
        .filter-btn { border: 1px solid #30363d; color: #94a3b8; transition: 0.2s; background: transparent; }
        .filter-btn.active { border-color: #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        
        /* Ocultar barra de scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans pb-20 selection:bg-blue-500 selection:text-black">

<nav class="p-4 md:p-6 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-500 tracking-tighter uppercase italic">FIT<span class="text-white">ENGINE</span></h1>
        <a href="index.html" class="flex items-center gap-2 bg-slate-800 hover:bg-yellow-500 hover:text-black px-6 py-2 rounded-full border border-slate-700 transition-all font-black text-[10px] uppercase italic">
            ← Volver al Dashboard
        </a>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6 space-y-12">
    <header class="text-center space-y-4">
        <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter">La Biblioteca Completa <span class="text-yellow-500 italic">de Ejercicios</span></h2>
        <p class="text-slate-400 text-xs md:text-sm font-bold max-w-2xl mx-auto">
            Base de datos con demostraciones en video HD e indicaciones de forma biomecánica.
        </p>
    </header>

    <section class="space-y-8">
        <input type="text" id="searchInput" placeholder="Buscar ejercicio..." class="w-full bg-[#0d1117] border border-[#30363d] p-4 rounded-xl outline-none focus:border-blue-500 text-white font-bold transition-all shadow-lg">
        
        <div class="space-y-6">
            <div>
                <p class="text-sm font-bold text-slate-300 mb-3">Por grupo muscular</p>
                <div class="flex flex-wrap gap-3" id="filter-muscle">
                    <button class="filter-btn active px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Todos">Todos</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Pecho">Pecho</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Espalda">Espalda</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Piernas">Piernas</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Hombros">Hombros</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Brazos">Brazos</button>
                </div>
            </div>

            <div>
                <p class="text-sm font-bold text-slate-300 mb-3">Por equipo</p>
                <div class="flex flex-wrap gap-3" id="filter-equipment">
                    <button class="filter-btn active px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Todos">Todos</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Peso Corporal">Peso corporal</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Mancuerna">Mancuerna</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Cable">Cable</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Barra">Barra</button>
                    <button class="filter-btn px-5 py-2.5 rounded-lg text-xs font-bold" data-filter="Máquina">Máquina</button>
                </div>
            </div>
        </div>
    </section>

    <div>
        <h3 class="text-xl font-bold text-white mb-6">Ejercicios Populares</h3>
        <div id="exerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 fade"></div>
    </div>
</main>

<div id="modalEjercicio" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] hidden flex flex-col items-center justify-center p-4 overflow-y-auto fade">
    <div class="bg-[#0d1117] border border-[#30363d] rounded-2xl w-full max-w-4xl shadow-2xl relative my-auto flex flex-col max-h-[90vh]">
        <div class="sticky top-0 bg-[#0d1117] z-10 border-b border-[#30363d] p-6 flex justify-between items-center rounded-t-2xl">
            <h2 id="detNombre" class="text-2xl font-bold text-white"></h2>
            <button onclick="cerrarDetalle()" class="text-slate-500 hover:text-red-500 font-black text-2xl">✕</button>
        </div>
        <div class="p-6 md:p-8 overflow-y-auto space-y-6 no-scrollbar">
            <div class="grid lg:grid-cols-2 gap-8 items-start">
                
                <div class="rounded-2xl overflow-hidden border border-[#30363d] bg-white">
                    <video id="detVideo" src="" class="w-full aspect-square object-cover" autoplay loop muted playsinline></video>
                </div>

                <div class="space-y-6">
                    <div class="bg-[#010409] p-5 rounded-xl border border-[#30363d]">
                        <h3 class="text-sm font-bold text-white mb-2">Consejo experto</h3>
                        <p id="detConsejo" class="text-sm text-slate-400 leading-relaxed"></p>
                    </div>
                    
                    <div>
                        <h3 class="text-sm font-bold text-white mb-3">Pasos a seguir</h3>
                        <ol id="detPasos" class="list-decimal list-inside space-y-2 text-sm text-slate-400"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
  // 1. BASE DE DATOS CON LOS NOMBRES DE LOS MP4
    const ejercicios = [
        { 
            id: 1, nombre: "Press de Banca con Barra", musculo: "Pecho", equipo: "Barra", 
            video: "pressbanca.mp4", 
            consejo: "Retrae escápulas y mantén los pies fijos en el suelo.", 
            pasos: ["Baja la barra al pecho medio", "Empuja con explosividad", "No bloquees codos al 100%"] 
        },
        { 
            id: 2, nombre: "Press Inclinado con Mancuernas", musculo: "Pecho", equipo: "Mancuerna", 
            video: "pressinclinadoconmancuernas.mp4", 
            consejo: "Inclinación a 30 grados máximo para proteger el hombro frontal.", 
            pasos: ["Sube empujando hacia el centro", "Baja lento sintiendo el estiramiento", "Mantén el pecho arriba"] 
        },
        { 
            id: 3, nombre: "Press Declinado", musculo: "Pecho", equipo: "Barra", 
            video: "pressdeclinado.mp4", 
            consejo: "Excelente para enfocar el trabajo en la porción inferior del pectoral.", 
            pasos: ["Asegura bien las piernas", "Baja la barra a la parte baja del pecho", "Empuja fuerte hacia arriba"] 
        },
        { 
            id: 4, nombre: "Cruce de Poleas", musculo: "Pecho", equipo: "Cable", 
            video: "crucedepoleas.mp4", 
            consejo: "Da un paso al frente para mayor estabilidad y rango de movimiento.", 
            pasos: ["Torso ligeramente inclinado", "Junta las manos al frente", "Controla la fase al regresar"] 
        },
        { 
            id: 5, nombre: "Peck Deck", musculo: "Pecho", equipo: "Máquina", 
            video: "peckdeck.mp4", 
            consejo: "Piensa en juntar los bíceps, no las manos. Mantén el pecho inflado.", 
            pasos: ["Espalda pegada al respaldo", "Abre hasta sentir el estiramiento", "Aprieta 1 segundo al centro"] 
        },
        { 
            id: 6, nombre: "Flexión de Brazos", musculo: "Pecho", equipo: "Peso Corporal", 
            video: "flexiones.mp4", 
            consejo: "Mantén el core apretado, tu cuerpo debe ser una tabla recta.", 
            pasos: ["Manos un poco más abiertas que los hombros", "Baja hasta rozar el suelo", "Sube extendiendo por completo"] 
        },
        { 
            id: 7, nombre: "Sentadilla Libre", musculo: "Piernas", equipo: "Barra", 
            video: "sentadilla.mp4", 
            consejo: "Baja hasta romper la paralela para máxima activación de fibras.", 
            pasos: ["Pies al ancho de los hombros", "Cadera hacia atrás y abajo", "Pecho siempre levantado"] 
        },
        { 
            id: 8, nombre: "Prensa de Piernas", musculo: "Piernas", equipo: "Máquina", 
            video: "presa.mp4", 
            consejo: "Nunca bloquees las rodillas por completo al extender el peso.", 
            pasos: ["Pies en el centro de la plataforma", "Baja hasta los 90 grados", "Empuja con los talones"] 
        },
        { 
            id: 9, nombre: "Extensión de Cuádriceps", musculo: "Piernas", equipo: "Máquina", 
            video: "extensionesdecuadriceps.mp4", 
            consejo: "Ajusta el asiento para que tus rodillas queden alineadas con la bisagra de la máquina.", 
            pasos: ["Apunta con las puntas de los pies hacia arriba", "Extiende hasta bloquear", "Sostén 1 segundo arriba"] 
        },
        { 
            id: 10, nombre: "Pulldown con Cable", musculo: "Espalda", equipo: "Cable", 
            video: "pulldownconcable.mp4", 
            consejo: "Lleva la barra a la clavícula, nunca detrás de la nuca.", 
            pasos: ["Saca pecho al bajar", "Tira con los codos hacia tus costados", "Controla la subida"] 
        },
        { 
            id: 11, nombre: "Remo con Barra", musculo: "Espalda", equipo: "Barra", 
            video: "remoent.mp4", 
            consejo: "Mantén la espalda recta y casi paralela al piso.", 
            pasos: ["Inclínate hacia adelante", "Jala la barra hacia el ombligo", "Aprieta la espalda arriba"] 
        },
        { 
            id: 12, nombre: "Press de Hombro en Máquina", musculo: "Hombros", equipo: "Máquina", 
            video: "pressdehombroenmaquina.mp4", 
            consejo: "No arquees demasiado la zona lumbar al empujar.", 
            pasos: ["Ajusta el asiento a la altura de los hombros", "Empuja sobre la cabeza", "Baja de forma controlada"] 
        },
        { 
            id: 13, nombre: "Elevaciones Laterales", musculo: "Hombros", equipo: "Mancuerna", 
            video: "elevacioneslateralesenmaquina.mp4", 
            consejo: "Imagina que estás sirviendo agua de unas jarras en la parte alta.", 
            pasos: ["Torso ligeramente inclinado al frente", "Sube liderando con los codos", "No pases la altura del hombro"] 
        },
        { 
            id: 14, nombre: "Curl de Bíceps", musculo: "Brazos", equipo: "Mancuerna", 
            video: "curldebicepsconmancuerna.mp4", 
            consejo: "Pega los codos a tus costillas y no los muevas hacia adelante.", 
            pasos: ["Agarre supino (palmas arriba)", "Sube contrayendo el bíceps", "Baja extendiendo completo"] 
        },
        { 
            id: 15, nombre: "Curl Inclinado", musculo: "Brazos", equipo: "Mancuerna", 
            video: "curldebicepsenclinacion.mp4", 
            consejo: "Deja que los brazos cuelguen rectos hacia abajo para estirar la cabeza larga del bíceps.", 
            pasos: ["Acuéstate en banco a 45 grados", "Mantén el codo fijo apuntando al suelo", "Sube controladamente"] 
        }
    ];

    const grid = document.getElementById('exerciseGrid');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('modalEjercicio');
    
    // Variables de Estado de Filtros Múltiples
    let activeMuscle = "Todos";
    let activeEq = "Todos";

    // 2. FUNCIÓN DE RENDERIZADO (CON BADGES Y VIDEO)
    function render(lista) {
        grid.innerHTML = "";
        lista.forEach(ex => {
            const card = document.createElement('div');
            card.className = "ex-card rounded-xl overflow-hidden fade flex flex-col";
            card.onclick = () => abrirDetalle(ex.id);
            
            // HTML de la Tarjeta
            card.innerHTML = `
                <div class="aspect-[4/3] bg-white relative">
                    <video src="${ex.video}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
                    <div class="absolute bottom-2 left-2 bg-black/50 p-1 rounded-full backdrop-blur-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <div class="p-4 flex flex-col flex-1 bg-[#0d1117]">
                    <h3 class="text-sm font-bold text-white mb-4 leading-snug">${ex.nombre}</h3>
                    <div class="mt-auto flex flex-wrap gap-2">
                        <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-bold px-2 py-1 rounded-md">${ex.musculo}</span>
                        <span class="bg-slate-800 text-slate-300 border border-slate-700 text-[10px] font-bold px-2 py-1 rounded-md">${ex.equipo}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 3. FUNCIONES DEL MODAL DE VIDEO
    function abrirDetalle(id) {
        const ex = ejercicios.find(e => e.id === id);
        if(!ex) return;
        document.getElementById("detNombre").innerText = ex.nombre;
        
        // Actualizamos el Video en vez de la Imagen
        const videoEl = document.getElementById("detVideo");
        videoEl.src = ex.video;
        videoEl.play(); // Forzamos el play al abrir
        
        document.getElementById("detConsejo").innerText = ex.consejo;
        document.getElementById("detPasos").innerHTML = ex.pasos.map(p => `<li class="ml-4">${p}</li>`).join("");
        
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
    }

    function cerrarDetalle() { 
        modal.classList.add("hidden"); 
        document.body.style.overflow = "auto"; 
        
        // Pausar el video al cerrar para no consumir recursos
        const videoEl = document.getElementById("detVideo");
        videoEl.pause();
        videoEl.src = ""; 
    }

    // 4. LÓGICA DE MÚLTIPLES FILTROS
    function filtrar() {
        const text = searchInput.value.toLowerCase();
        
        const filtrados = ejercicios.filter(ex => {
            const matchName = ex.nombre.toLowerCase().includes(text);
            const matchMuscle = activeMuscle === "Todos" || ex.musculo === activeMuscle;
            const matchEq = activeEq === "Todos" || ex.equipo === activeEq;
            
            // Tiene que cumplir las 3 condiciones
            return matchName && matchMuscle && matchEq;
        });
        
        render(filtrados);
    }

    // Event Listeners
    searchInput.addEventListener('input', filtrar);
    
    // Filtro Músculos
    document.querySelectorAll('#filter-muscle .filter-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('#filter-muscle .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeMuscle = btn.dataset.filter;
            filtrar();
        };
    });

    // Filtro Equipos
    document.querySelectorAll('#filter-equipment .filter-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('#filter-equipment .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeEq = btn.dataset.filter;
            filtrar();
        };
    });

    // Carga inicial
    render(ejercicios);
</script>
</body>
</html>
