<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar - FitEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 overflow-hidden font-sans">

  <div class="absolute top-10 left-10 w-64 h-64 bg-yellow-500/10 blur-[120px] rounded-full"></div>

  <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-md shadow-2xl relative z-10">
    <h1 class="text-3xl font-black text-yellow-500 text-center mb-1 tracking-tighter uppercase">Reset<span>Password</span></h1>
    <p class="text-slate-500 text-sm text-center mb-8 italic">Te enviaremos un enlace a tu correo para restablecer tu acceso.</p>

    <div class="space-y-5">
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Tu Correo Electrónico</label>
        <input type="email" id="resetEmail" placeholder="ejemplo@gmail.com" 
               class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none transition-all text-white">
      </div>
      
      <button id="sendLinkBtn" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl hover:bg-yellow-400 transition-all shadow-lg shadow-yellow-500/10 uppercase tracking-widest">
        ENVIAR ENLACE
      </button>
    </div>
    
    <p class="mt-8 text-center text-xs text-slate-500">
      <a href="login.html" class="text-yellow-500 font-bold hover:underline">← Volver al Login</a>
    </p>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    const btn = document.getElementById("sendLinkBtn");

    btn.onclick = async () => {
      const email = document.getElementById("resetEmail").value;
      if (!email) return alert("Manito, pon el correo para poder enviarte el link.");

      try {
        await sendPasswordResetEmail(auth, email);
        alert("¡Listo! Revisa tu correo (mira en Spam por si acaso).");
        window.location.href = "login.html";
      } catch (error) {
        alert("Error: No pudimos encontrar ese correo o el servicio falló.");
      }
    };
  </script>
</body>
</html>
