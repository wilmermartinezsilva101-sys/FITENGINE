<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Guerrero - FitEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 font-sans overflow-x-hidden">

  <div class="absolute bottom-10 right-10 w-64 h-64 bg-yellow-500/10 blur-[120px] rounded-full"></div>

  <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 w-full max-w-md shadow-2xl relative z-10 my-10">
    <h1 class="text-4xl font-black text-yellow-500 text-center mb-1 tracking-tighter uppercase italic">FIT<span class="text-white">ENGINE</span></h1>
    <p class="text-slate-500 text-[10px] text-center mb-8 font-black uppercase tracking-[0.2em]">Sincronización de Biometría Humana</p>

    <div class="space-y-4">
      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej: Wilmer Martinez" 
               class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold">
      </div>

      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Email</label>
        <input type="email" id="email" placeholder="atleta@ejemplo.com" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm">
      </div>

      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Contraseña (Mínimo 8 caracteres)</label>
        <input type="password" id="password" placeholder="Ej: Hola123#" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm">
        <div class="mt-2 px-1 text-center">
            <div id="strengthBar" class="h-1 w-0 bg-red-600 rounded-full transition-all duration-500 mb-1"></div>
            <p id="strengthText" class="text-[8px] text-slate-600 font-black uppercase italic tracking-tighter">Seguridad: Pendiente</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <div class="col-span-2">
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Peso Corporal (Máx 500)</label>
          <div class="flex h-12 shadow-lg">
            <input type="text" id="peso_corporal" maxlength="5" placeholder="0.0" 
                   class="w-full bg-slate-950 border border-slate-700 p-3 rounded-l-xl focus:border-yellow-500 outline-none text-white text-sm font-bold">
            <select id="peso_unit" class="bg-slate-800 border border-slate-700 px-3 rounded-r-xl text-yellow-500 font-black text-[10px] uppercase cursor-pointer">
              <option value="kg">KG</option>
              <option value="lbs">LBS</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Altura (100-250 cm)</label>
          <input type="text" id="altura" maxlength="3" placeholder="175" 
                 class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold text-center">
        </div>

        <div>
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Edad (12-100 Años)</label>
          <input type="text" id="edad" maxlength="3" placeholder="22" 
                 class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold text-center">
        </div>

        <div class="col-span-2">
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Género Biológico</label>
          <select id="genero" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-black uppercase italic cursor-pointer">
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
          </select>
        </div>
      </div>
      
      <button id="registerBtn" disabled 
              class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl opacity-50 cursor-not-allowed transition-all shadow-xl shadow-yellow-500/10 uppercase italic tracking-tighter mt-4">
        Sincronizar Guerrero
      </button>
    </div>
    
    <p class="mt-8 text-center text-[10px] text-slate-500 font-bold uppercase tracking-widest">
      ¿Ya eres parte? <a href="login.html" class="text-yellow-500 hover:underline ml-1">Inicia sesión</a>
    </p>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const pesoInput = document.getElementById('peso_corporal');
    const alturaInput = document.getElementById('altura');
    const edadInput = document.getElementById('edad');
    const pwdInput = document.getElementById('password');
    const regBtn = document.getElementById('registerBtn');

    // --- FILTROS DE ENTRADA (Cero letras, cero dinosaurios) ---
    
    const limpiarInput = (input, max) => {
      input.oninput = function() {
        this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
        if (parseFloat(this.value) > max) this.value = max;
      };
    };

    limpiarInput(pesoInput, 500);
    limpiarInput(alturaInput, 250);
    limpiarInput(edadInput, 100);

    // --- VALIDACIÓN DE PASSWORD FLEXIBLE (Acepta #, @, !) ---
    pwdInput.oninput = function() {
      const val = this.value;
      const hasUpper = /[A-Z]/.test(val);
      const hasNum = /[0-9]/.test(val);
      const hasSpecial = /[#@!$%*?&._-]/.test(val);
      const hasLength = val.length >= 8;

      if (hasUpper && hasNum && hasSpecial && hasLength) {
        document.getElementById('strengthBar').style.width = "100%";
        document.getElementById('strengthBar').className = "h-1 bg-green-500 rounded-full transition-all";
        document.getElementById('strengthText').innerText = "VÁLIDA PARA ENTRENAR 🔥";
        document.getElementById('strengthText').className = "text-[8px] mt-1 text-green-500 font-black";
        regBtn.disabled = false;
        regBtn.classList.remove("opacity-50", "cursor-not-allowed");
      } else {
        document.getElementById('strengthBar').style.width = "30%";
        document.getElementById('strengthBar').className = "h-1 bg-red-600 rounded-full transition-all";
        document.getElementById('strengthText').innerText = "FALTA: 8 CARAC, MAYÚSCULA, NÚMERO Y SÍMBOLO (#@!)";
        document.getElementById('strengthText').className = "text-[8px] mt-1 text-slate-600 font-black";
        regBtn.disabled = true;
        regBtn.classList.add("opacity-50", "cursor-not-allowed");
      }
    };

    // --- ACCIÓN DE REGISTRO ---
    regBtn.onclick = async () => {
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const pass = pwdInput.value;
      const pesoRaw = parseFloat(pesoInput.value);
      const altura = parseInt(alturaInput.value);
      const edad = parseInt(edadInput.value);
      const unit = document.getElementById("peso_unit").value;

      if (!nombre) return alert("Guerrero, dinos tu nombre para personalizar tu experiencia.");
      if (!pesoRaw || altura < 100 || edad < 12) return alert("Revisa tus datos biométricos.");

      const pesoKG = unit === "lbs" ? (pesoRaw / 2.20462).toFixed(2) : pesoRaw;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        // GUARDADO EN FIRESTORE (Incluyendo el Nombre)
        await setDoc(doc(db, "usuarios", user.uid), {
          uid: user.uid,
          nombre: nombre,
          email: email,
          peso_corporal_kg: parseFloat(pesoKG),
          altura_cm: altura,
          edad: edad,
          genero: document.getElementById("genero").value,
          creado_el: serverTimestamp()
        });

        window.location.href = "index.html";
      } catch (e) { alert("Error: " + e.message); }
    };
  </script>
</body>
</html>
