<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Guerrero - FitEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 font-sans overflow-x-hidden">

  <div class="absolute bottom-10 right-10 w-64 h-64 bg-yellow-500/10 blur-[120px] rounded-full"></div>

  <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 w-full max-w-md shadow-2xl relative z-10 my-10">
    <h1 class="text-4xl font-black text-yellow-500 text-center mb-1 tracking-tighter uppercase italic">FIT<span class="text-white">ENGINE</span></h1>
    <p class="text-slate-500 text-[10px] text-center mb-8 font-black uppercase tracking-[0.2em]">Sincronización de Biometría Humana</p>

    <div class="space-y-4">
      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej: Wilmer Martinez" 
               class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold">
      </div>

      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Email</label>
        <input type="email" id="email" placeholder="atleta@ejemplo.com" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm">
      </div>

      <div>
        <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Contraseña (Mín. 6)</label>
        <div class="relative">
          <input type="password" id="password" placeholder="Tu clave secreta" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm">
          <button id="togglePass" class="absolute right-3 top-3 text-slate-500 hover:text-yellow-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.301 8.242 7.152 5 12 5c4.848 0 8.699 3.242 9.964 6.678a1.012 1.012 0 010 .644C20.699 15.758 16.848 19 12 19c-4.848 0-8.699-3.242-9.964-6.678z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
        <div class="mt-2 px-1 text-center">
            <div id="strengthBar" class="h-1 w-0 bg-red-600 rounded-full transition-all duration-500 mb-1"></div>
            <p id="strengthText" class="text-[8px] text-slate-600 font-black uppercase italic tracking-tighter">Seguridad: Pendiente</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <div class="col-span-2">
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Peso Corporal</label>
          <div class="flex h-12 shadow-lg">
            <input type="text" id="peso_corporal" maxlength="5" placeholder="0.0" 
                   class="w-full bg-slate-950 border border-slate-700 p-3 rounded-l-xl focus:border-yellow-500 outline-none text-white text-sm font-bold">
            <select id="peso_unit" class="bg-slate-800 border border-slate-700 px-3 rounded-r-xl text-yellow-500 font-black text-[10px] uppercase cursor-pointer">
              <option value="kg">KG</option>
              <option value="lbs">LBS</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Altura (cm)</label>
          <input type="text" id="altura" maxlength="3" placeholder="175" 
                 class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold text-center">
        </div>

        <div>
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Edad</label>
          <input type="text" id="edad" maxlength="3" placeholder="22" 
                 class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold text-center">
        </div>

        <div class="col-span-2">
          <label class="text-[9px] font-black text-slate-500 uppercase ml-1 tracking-widest">Perfil Biológico</label>
          <select id="genero" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none text-white text-sm font-bold uppercase appearance-none cursor-pointer">
            <option value="" disabled selected>Selecciona tu perfil...</option>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
            <option value="otro">Otro / Prefiero no decirlo</option>
          </select>
        </div>
      </div>
      
      <button id="registerBtn" 
              class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl transition-all shadow-xl shadow-yellow-500/10 uppercase italic tracking-tighter mt-4 hover:bg-yellow-400">
        Sincronizar Guerrero
      </button>
    </div>
    
    <p class="mt-8 text-center text-[10px] text-slate-500 font-bold uppercase tracking-widest">
      ¿Ya eres parte? <a href="login.html" class="text-yellow-500 hover:underline ml-1">Inicia sesión</a>
    </p>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const pesoInput = document.getElementById('peso_corporal');
    const alturaInput = document.getElementById('altura');
    const edadInput = document.getElementById('edad');
    const pwdInput = document.getElementById('password');
    const generoInput = document.getElementById('genero'); // Referencia al nuevo select
    const regBtn = document.getElementById('registerBtn');
    const togglePass = document.getElementById('togglePass');

    // Ver/Ocultar pass
    togglePass.onclick = () => {
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    };

    // Validar números
    const limpiarInput = (input, max) => {
      input.oninput = function() {
        this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
        if (parseFloat(this.value) > max) this.value = max;
      };
    };
    limpiarInput(pesoInput, 500);
    limpiarInput(alturaInput, 250);
    limpiarInput(edadInput, 100);

    // Lógica de fuerza visual
    let isStrong = false;
    pwdInput.oninput = function() {
      const val = this.value;
      const hasLength = val.length >= 8;
      const hasMixed = /[A-Z]/.test(val) && /[0-9]/.test(val);

      if (hasLength && hasMixed) {
        document.getElementById('strengthBar').style.width = "100%";
        document.getElementById('strengthBar').className = "h-1 bg-green-500 rounded-full transition-all";
        document.getElementById('strengthText').innerText = "VÁLIDA PARA ENTRENAR 🔥";
        isStrong = true;
      } else {
        document.getElementById('strengthBar').style.width = "40%";
        document.getElementById('strengthBar').className = "h-1 bg-yellow-500 rounded-full transition-all";
        document.getElementById('strengthText').innerText = "SEGURIDAD BÁSICA";
        isStrong = false;
      }
    };

    regBtn.onclick = async () => {
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const pass = pwdInput.value;
      const generoVal = generoInput.value;

      // Validación con el género incluido
      if (!nombre || !email || pass.length < 6 || !generoVal) {
        return alert("Guerrero, completa todos los datos, incluyendo tu perfil biológico.");
      }

      if (!isStrong) {
        const confirmacion = confirm("¿Usar esta contraseña sencilla? Recomendamos añadir una mayúscula y un número.");
        if (!confirmacion) return;
      }

      const pesoRaw = parseFloat(pesoInput.value) || 0;
      const altura = parseInt(alturaInput.value) || 0;
      const edad = parseInt(edadInput.value) || 0;
      const unit = document.getElementById("peso_unit").value;
      const pesoKG = unit === "lbs" ? (pesoRaw / 2.20462).toFixed(2) : pesoRaw;

      try {
        regBtn.innerText = "SINCRONIZANDO...";
        regBtn.disabled = true;

        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        // Se guarda todo en Firebase, incluyendo el género
        await setDoc(doc(db, "usuarios", user.uid), {
          uid: user.uid,
          nombre: nombre,
          email: email,
          peso_corporal_kg: parseFloat(pesoKG),
          altura_cm: altura,
          edad: edad,
          genero: generoVal, // <--- EL GÉNERO SE GUARDA AQUÍ
          creado_el: serverTimestamp()
        });

        // Redirige al Dashboard, que ahora lo recibirá con los brazos abiertos
        window.location.href = "index.html";
      } catch (e) { 
        alert("Error: " + e.message); 
        regBtn.innerText = "SINCRONIZAR GUERRERO";
        regBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
