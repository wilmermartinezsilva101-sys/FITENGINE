<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - FitEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 overflow-hidden">

  <div class="absolute bottom-10 right-10 w-64 h-64 bg-yellow-500/10 blur-[120px] rounded-full"></div>

  <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-md shadow-2xl relative z-10">
    <h1 class="text-4xl font-black text-yellow-500 text-center mb-1 tracking-tighter">FIT<span class="text-white">ENGINE</span></h1>
    <p class="text-slate-500 text-sm text-center mb-8">Crea tu cuenta de Guerrero 🔥</p>

    <div class="space-y-5">
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Email Corporativo o Personal</label>
        <input type="email" id="email" placeholder="ejemplo@gmail.com" 
               class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none transition-all text-white">
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Contraseña segura</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" 
               class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl focus:border-yellow-500 outline-none transition-all text-white">
      </div>
      
      <button id="registerBtn" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl hover:bg-yellow-400 hover:-translate-y-1 active:translate-y-0 transition-all shadow-lg shadow-yellow-500/10">
        REGISTRARSE AHORA
      </button>
    </div>
    
    <p class="mt-8 text-center text-xs text-slate-500">
      ¿Ya eres parte? <a href="login.html" class="text-yellow-500 font-bold hover:underline">Inicia sesión</a>
    </p>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    onAuthStateChanged(auth, (user) => { if (user) window.location.href = "index.html"; });
  </script>
</body>
</html>
